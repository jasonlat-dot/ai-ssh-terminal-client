<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>AI Shell — folded terminal</title>
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#f2f7ff"/><stop offset="1" stop-color="#eeecfa"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7491ef" stop-opacity=".24"/><stop offset="1" stop-color="#7491ef" stop-opacity="0"/></radialGradient>
    <linearGradient id="roof" x1="5%" y1="100%" x2="85%" y2="0%"><stop stop-color="#504fff"/><stop offset=".37" stop-color="#168fff"/><stop offset=".72" stop-color="#23d7e9"/><stop offset="1" stop-color="#a2fff0"/></linearGradient>
    <linearGradient id="screen" x1="5%" y1="90%" x2="95%" y2="5%"><stop stop-color="#07152e"/><stop offset=".4" stop-color="#0c1940"/><stop offset=".72" stop-color="#103966"/><stop offset="1" stop-color="#137fb5"/></linearGradient>
    <radialGradient id="screenLight" cx="95%" cy="8%" r="90%"><stop stop-color="#13d4ed" stop-opacity=".3"/><stop offset="1" stop-color="#13d4ed" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="75%" y2="100%"><stop stop-color="#7d72ff"/><stop offset=".35" stop-color="#54dbff"/><stop offset=".65" stop-color="#14c2ec"/><stop offset="1" stop-color="#4250df"/></linearGradient>
    <linearGradient id="turn" x1="80%" y1="0%" x2="30%" y2="100%"><stop stop-color="#137fef"/><stop offset=".28" stop-color="#2c53e4"/><stop offset=".65" stop-color="#7346df"/><stop offset="1" stop-color="#bf8cfb"/></linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="85%" x2="90%" y2="18%"><stop stop-color="#22dbe5"/><stop offset=".22" stop-color="#3785ff"/><stop offset=".5" stop-color="#7864f1"/><stop offset=".76" stop-color="#c2adff"/><stop offset="1" stop-color="#ffe9f6"/></linearGradient>
    <linearGradient id="thickness" x1="0%" y1="100%" x2="100%" y2="0%"><stop stop-color="#1477c9"/><stop offset=".5" stop-color="#4d4ad0"/><stop offset="1" stop-color="#b594e2"/></linearGradient>
    <linearGradient id="lip" x1="0%" y1="100%" x2="100%" y2="0%"><stop stop-color="#4adeee" stop-opacity="0"/><stop offset=".4" stop-color="#bfc9ff"/><stop offset="1" stop-color="#fff5ff"/></linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#fff"/><stop offset="1" stop-color="#ccf4ff"/></linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="70%" y2="100%"><stop stop-color="#ff91b0"/><stop offset="1" stop-color="#fa3f71"/></linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="70%" y2="100%"><stop stop-color="#ffe997"/><stop offset="1" stop-color="#ffc84a"/></linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="70%" y2="100%"><stop stop-color="#89f5bb"/><stop offset="1" stop-color="#2acd89"/></linearGradient>
    <filter id="blur" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="face"><path d="M214 370 C214 322 243 303 289 313 L735 402 C784 412 815 435 815 474 C815 500 799 522 774 543 L480 729 C451 748 421 751 389 740 L253 695 C226 686 214 664 214 633Z"/></clipPath>
  </defs>
  <!-- Matte porcelain tile and soft grounded shadow -->
  <rect x="68" y="60" width="888" height="888" rx="196" fill="url(#tile)" stroke="#fff" stroke-width="3"/>
  <ellipse cx="527" cy="710" rx="382" ry="220" fill="url(#halo)"/>
  <ellipse cx="526" cy="806" rx="255" ry="35" fill="#4b4db5" opacity=".22" filter="url(#blur)"/>
  <path d="M234 378 L580 210 L815 372 L797 670 L523 825 L249 700Z" fill="#405cae" opacity=".16" filter="url(#blur)"/>
  <!-- Back fold, rounded apex and softly curved shoulder -->
  <path d="M217 350 C224 321 248 303 281 287 L526 177 C559 162 586 164 616 183 L790 300 C829 326 845 351 846 391 L843 471 C827 430 792 412 747 403 L285 312 C256 306 231 318 217 350Z" fill="url(#roof)"/>
  <path d="M282 288 L529 179 C560 165 586 168 614 185 L785 300" fill="none" stroke="#d0fff6" stroke-opacity=".45" stroke-width="2.5"/>
  <!-- Small contact shadow where the folded lid meets the terminal -->
  <path d="M235 334 C250 316 272 314 297 319 L745 410" fill="none" stroke="#1c319b" stroke-opacity=".45" stroke-width="12" filter="url(#soft)"/>
  <!-- Rounded rim and recessed display -->
  <path d="M203 372 C202 318 237 290 289 303 L740 392 C800 404 837 434 836 478 C835 512 814 539 783 562 L484 746 C451 767 417 767 384 756 L248 710 C216 699 202 674 202 639Z" fill="url(#rim)"/>
  <path d="M214 370 C214 322 243 303 289 313 L735 402 C784 412 815 435 815 474 C815 500 799 522 774 543 L480 729 C451 748 421 751 389 740 L253 695 C226 686 214 664 214 633Z" fill="url(#screen)"/>
  <g clip-path="url(#face)"><rect x="212" y="310" width="607" height="439" fill="url(#screenLight)"/><path d="M250 317 L733 413 L807 474 L410 392Z" fill="#c6e8ff" opacity=".035"/></g>
  <path d="M211 370 C211 324 244 303 288 313 L735 402" fill="none" stroke="#c7f9ff" stroke-opacity=".62" stroke-width="2.5"/>
  <path d="M208 389 L208 630 C208 663 219 685 246 696" fill="none" stroke="#5aedff" stroke-opacity=".45" stroke-width="2"/>
  <!-- Curved right return: a continuous ribbon rather than a sharp wedge -->
  <path d="M738 393 C796 403 840 432 839 478 C839 515 815 544 782 568 L495 749 C533 706 579 663 631 619 L775 499 C808 471 810 435 738 393Z" fill="url(#turn)"/>
  <path d="M741 397 C795 408 833 436 834 475" fill="none" stroke="#b2e6ff" stroke-opacity=".38" stroke-width="2"/>
  <!-- Thin underside gives the front fold real thickness -->
  <path d="M205 637 C210 670 230 688 261 699 L388 742 C424 754 451 750 485 730 L738 581 C768 563 795 553 814 557 C835 562 840 580 837 609 L831 647 C828 672 813 690 784 706 L554 833 C521 852 490 855 458 841 L269 757 C229 739 204 709 205 668Z" fill="url(#thickness)"/>
  <!-- Front ribbon with a soft rounded cap -->
  <path d="M205 627 C212 658 232 677 261 687 L390 730 C424 742 452 738 485 718 L738 569 C768 551 794 541 814 545 C835 550 840 569 837 597 L831 635 C828 660 813 678 784 694 L554 821 C521 840 490 843 458 829 L269 745 C229 727 205 697 205 656Z" fill="url(#ribbon)"/>
  <path d="M485 719 L738 569 C768 551 794 541 814 545 C831 549 839 562 839 580" fill="none" stroke="url(#lip)" stroke-width="3"/>
  <path d="M229 704 C241 718 255 728 275 737 L461 820 C491 833 520 831 550 814 L783 687" fill="none" stroke="#c1dfff" stroke-opacity=".32" stroke-width="2"/>
  <!-- Traffic lights: integrated gloss and subtle local shadows -->
  <g fill="#000c28" opacity=".35" filter="url(#soft)"><circle cx="281" cy="373" r="18"/><circle cx="340" cy="385" r="18"/><circle cx="399" cy="397" r="18"/></g>
  <circle cx="281" cy="366" r="17" fill="url(#red)"/><circle cx="340" cy="378" r="17" fill="url(#yellow)"/><circle cx="399" cy="390" r="17" fill="url(#green)"/>
  <g fill="#fff" opacity=".28"><ellipse cx="277" cy="360" rx="7" ry="4"/><ellipse cx="336" cy="372" rx="7" ry="4"/><ellipse cx="395" cy="384" rx="7" ry="4"/></g>
  <!-- Slightly smaller optical prompt, with restrained bloom -->
  <g fill="none" stroke="#74d5ff" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" opacity=".45" filter="url(#glow)"><path d="M292 454 L366 525 L291 596"/><path d="M420 611 L487 620"/></g>
  <g fill="none" stroke="url(#glyph)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M292 454 L366 525 L291 596"/><path d="M420 611 L487 620"/></g>
</svg>
