<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Base: warmer, more refined violet — less muddy, more premium -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a4dff"/>
      <stop offset="55%" stop-color="#4a3edb"/>
      <stop offset="100%" stop-color="#2b1f9c"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="28%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a89bff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a89bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="82%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#7ad9ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7ad9ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Terminal body: clean frosted glass -->
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- AI spark -->
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e6ecff"/>
      <stop offset="100%" stop-color="#9ab0ff"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dde4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7d92ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ========== BASE ========== -->
  <rect x="14" y="14" width="228" height="228" rx="58" ry="58" fill="url(#bg)"/>
  <rect x="14" y="14" width="228" height="228" rx="58" ry="58" fill="url(#bgGlow)"/>
  <rect x="14" y="14" width="228" height="228" rx="58" ry="58" fill="url(#bgGlow2)"/>
  <!-- Inner stroke -->
  <rect x="22" y="22" width="212" height="212" rx="52" ry="52"
        fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2"/>

  <!-- ========== TERMINAL WINDOW (smaller, centered lower) ========== -->
  <g filter="url(#winShadow)">
    <!-- Window body: 132 wide x 88 tall, centered around y=140 -->
    <rect x="62" y="96" width="132" height="88" rx="11" ry="11"
          fill="url(#window)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.1"/>

    <!-- Title bar -->
    <path d="M 62 107 L 62 121 L 194 121 L 194 107 Q 194 96 183 96 L 73 96 Q 62 96 62 107 Z"
          fill="#ffffff" fill-opacity="0.12"/>
    <line x1="62" y1="121" x2="194" y2="121"
          stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>

    <!-- Traffic lights (smaller) -->
    <circle cx="71" cy="108.5" r="2.6" fill="#ff6f7a"/>
    <circle cx="80" cy="108.5" r="2.6" fill="#ffc857"/>
    <circle cx="89" cy="108.5" r="2.6" fill="#5cf2c0"/>

    <!-- Title pill -->
    <rect x="108" y="103" width="58" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.16"/>
    <text x="137" y="111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="6.5" fill="#ffffff" fill-opacity="0.85" text-anchor="middle"
          font-weight="600" letter-spacing="0.4">ai-shell</text>
  </g>

  <!-- Terminal body content -->
  <g transform="translate(72 130)">
    <!-- $ prompt -->
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" font-weight="700" fill="#5cf2c0">$</text>
    <!-- command -->
    <text x="8" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" font-weight="600" fill="#ffffff" fill-opacity="0.95">deploy</text>
    <!-- second line -->
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" font-weight="700" fill="#9aa6ff" fill-opacity="0.8">›</text>
    <text x="8" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" font-weight="500" fill="#ffffff" fill-opacity="0.7">done 1.2s</text>
    <!-- third line: prompt + cursor (blinking) -->
    <text x="0" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" font-weight="700" fill="#5cf2c0">$</text>
    <rect x="9" y="24" width="6" height="9" rx="1" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- ========== AI SPARK (bigger, top-right, the hero element) ========== -->
  <g transform="translate(192 56)">
    <!-- Soft glow halo -->
    <circle cx="0" cy="0" r="34" fill="url(#sparkGlow)" filter="url(#softGlow)"/>
    <!-- 4-point star, larger & sharper -->
    <g filter="url(#softGlow)">
      <path d="M 0 -28 L 5.5 -5.5 L 28 0 L 5.5 5.5 L 0 28 L -5.5 5.5 L -28 0 L -5.5 -5.5 Z"
            fill="url(#spark)"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
    </g>
  </g>

  <!-- Tiny floating data dots (very subtle, lower-left) -->
  <g opacity="0.7">
    <circle cx="54" cy="194" r="2" fill="#5cf2c0"/>
    <circle cx="62" cy="200" r="1.4" fill="#5cf2c0" opacity="0.6"/>
  </g>
</svg>