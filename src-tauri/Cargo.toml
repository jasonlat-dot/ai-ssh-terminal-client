[package]
name = "shellpilot"
version = "0.2.5"
description = "ShellPilot desktop SSH terminal and AI workspace"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_ssh_terminal_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shellpilot-server = { path = "../../ai-ssh-terminal-server-rust" }
axum = "0.8"
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client retained for application updates; future model requests belong to the Rust Agent layer.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
portable-pty = "0.9"
# Safely simplify canonical Windows paths before passing them to Java.
dunce = "1.0.5"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows APIs used by local terminal/process handling.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_Shell"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tempfile = "3"
base64 = "0.22"
minisign-verify = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
