<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f7ff" />
    <meta name="description" content="Agent SSH 智能终端客户端 · 前端演示" />
    <title>Agent SSH</title>
    <script>
      try {
        const preference = localStorage.getItem('agent-ssh-theme') || 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (_) {}
    </script>
    <style>
      :root { --boot-bg: #f2f7ff; --boot-panel: #ffffff; --boot-soft: #f7faff; --boot-line: #e2eaf7; --boot-text: #12234e; --boot-muted: #7184b1; --boot-blue: #2675ff; --boot-shadow: #cadef638; background: var(--boot-bg); }
      :root[data-theme='dark'] { --boot-bg: #0c1320; --boot-panel: #172233; --boot-soft: #111c2b; --boot-line: #26364a; --boot-text: #dce8f6; --boot-muted: #aec0d4; --boot-blue: #68a7ff; --boot-shadow: #02071152; }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: var(--boot-bg); }
      .boot-fallback {
        display: grid;
        width: 100%;
        height: 100dvh;
        grid-template-rows: 68px minmax(0, 1fr) 36px;
        color: var(--boot-text);
        background: var(--boot-bg);
        font-family: var(--font-ui, 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif);
        font-size: 13px;
        line-height: 1.6;
      }
      .boot-header { display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid var(--boot-line); background: var(--boot-panel); }
      .boot-brand { display: flex; align-items: center; gap: 12px; }
      .boot-mark { display: block; width: 36px; height: 36px; flex-shrink: 0; object-fit: contain; }
      .boot-brand > span:last-child { display: flex; flex-direction: column; }
      .boot-brand strong { font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
      .boot-brand small { margin-top: 2px; color: var(--boot-muted); font-size: 11px; }
      .boot-main { display: grid; min-height: 0; place-items: center; padding: 32px 24px; overflow: auto; }
      .boot-panel { display: flex; align-items: flex-start; flex-direction: column; width: min(760px, 100%); gap: 20px; padding: 32px; border: 1px solid var(--boot-line); border-radius: 12px; background: var(--boot-panel); box-shadow: 0 6px 22px var(--boot-shadow); }
      .boot-icon { display: grid; width: 46px; height: 46px; place-items: center; border: 1px solid color-mix(in srgb, var(--boot-blue) 25%, var(--boot-line)); border-radius: 10px; background: color-mix(in srgb, var(--boot-blue) 10%, var(--boot-panel)); }
      .boot-icon img { width: 24px; height: 24px; }
      .boot-copy { padding-top: 1px; }
      .boot-status { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--boot-muted); font-size: 11px; font-weight: 500; }
      .boot-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--boot-blue); }
      .boot-copy h1 { margin: 0; color: var(--boot-text); font-size: 26px; font-weight: 600; line-height: 1.35; letter-spacing: -.4px; }
      .boot-copy > p:last-child { margin: 12px 0 0; color: var(--boot-muted); font-size: 14px; line-height: 1.75; }
      .boot-footer { display: flex; align-items: center; justify-content: center; padding: 0 24px; color: var(--boot-muted); font-size: 11px; }
      @media (max-width: 640px) { .boot-header { padding: 0 16px; } .boot-brand small { display: none; } .boot-main { padding: 20px 16px; } .boot-panel { padding: 24px 20px; } .boot-copy h1 { font-size: 23px; } }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="boot-fallback" aria-live="polite" aria-busy="true">
        <header class="boot-header">
          <div class="boot-brand">
            <img class="boot-mark" src="/agent-ssh-header.svg" alt="" />
            <span><strong>Agent SSH</strong><small>智能远程开发助手</small></span>
          </div>
        </header>
        <section class="boot-main">
          <div class="boot-panel">
            <div class="boot-icon"><img src="/agent-ssh-header.svg" alt="" /></div>
            <div class="boot-copy">
              <p class="boot-status"><i></i>正在载入</p>
              <h1>正在初始化客户端</h1>
              <p>正在准备窗口与本地运行环境…</p>
            </div>
          </div>
        </section>
        <footer class="boot-footer"><span>本地客户端 · Agent SSH</span></footer>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
