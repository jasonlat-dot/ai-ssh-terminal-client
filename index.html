<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7faff" />
    <meta name="description" content="ShellPilot 智能终端与 Agent 协作工作区" />
    <title>ShellPilot</title>
    <script>
      try {
        const saved = localStorage.getItem('agent-ssh-theme');
        const preference = saved === 'night' || saved === 'dark' || saved === 'light' ? saved
          : saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const dark = preference !== 'light';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (saved === 'system') localStorage.setItem('agent-ssh-theme', preference);
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="/src/components/StartupScreen.css" />
    <link rel="stylesheet" href="/src/night-theme.css" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #f7f8fa; }
      :root[data-theme='dark'] body { background: #303942; }
      :root[data-theme-preference='night'] body { background: #101216; }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="startup-screen is-checking" aria-busy="true">
        <header class="startup-header"><span class="startup-header-wordmark">ShellPilot<span class="startup-header-dot"></span></span></header>
        <div class="startup-main">
          <section class="startup-content" aria-labelledby="startup-title">
            <div class="startup-symbol" aria-hidden="true">
              <svg class="startup-wire" viewBox="0 0 400 260" fill="none">
                <g class="startup-orbit" stroke="currentColor" stroke-width="1"><ellipse cx="200" cy="130" rx="158" ry="88" stroke-dasharray="2 9" /><path d="M18 132h65m234 0h65M200 14v34m0 164v34" /></g>
                <g class="startup-frame" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M153 66h92c14 0 25 11 25 25v78c0 14-11 25-25 25h-92c-14 0-25-11-25-25V91c0-14 11-25 25-25Z" /><path class="startup-frame-inner" d="M144 88h111m-111 3v76c0 7 5 12 12 12h88" /><path class="startup-chevron" d="m162 111 21 19-21 19" stroke-width="5" /><path class="startup-command-cursor" d="M203 149h29" stroke-width="5" /></g>
              </svg>
              <span class="startup-symbol-halo"></span>
            </div>
            <h1 id="startup-title">Shell<span>Pilot</span><span class="startup-wordmark-cursor" aria-hidden="true">_</span></h1>
            <p class="startup-tagline">让思路沿着终端，走到答案</p>
            <div class="startup-readiness" role="status" aria-live="polite"><span class="startup-status-title"><i></i>正在准备你的工作区</span><div class="startup-progress" aria-hidden="true"><span></span></div><p class="startup-status-message">正在载入客户端…</p></div>
          </section>
        </div>
        <footer class="startup-footer"><span>你的终端协作空间</span><span>SSH <i></i> SFTP <i></i> AGENT</span></footer>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
